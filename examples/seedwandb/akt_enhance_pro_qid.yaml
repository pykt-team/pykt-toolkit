    values: [0.2]
  learning_rate:
    values: [1e-3]
  num_epochs:
    values: [200]
  batch_size:
    values: [64]
  seed:
    values: [42]
  fold:
    values: [0]
  use_wandb:
    values: [0]
  add_uuid:
    values: [0]
