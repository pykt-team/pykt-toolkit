program: wandb_akt_enhance_pro_qid_train.py
method: grid
metric:
  goal: maximize
  name: validauc
parameters:
  model_name:
    values: ["akt_enhance_pro_qid"]
  dataset_name:
    values: ["jiuzhang_grade3_en", "jiuzhang_grade45_cn", "jiuzhang_grade7_cn"]
  emb_type:
    values: ["qid"]
  save_dir:
    values: ["models/akt_enhance_pro_qid"]
  d_model:
    values: [64]
  d_ff:
    values: [64]
  num_attn_heads:
    values: [4]
  n_blocks:
    values: [1]
